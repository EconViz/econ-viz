name: CI / Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  test-matrix:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-packages --all-extras

      - name: Run tests
        run: uv run pytest

  examples:
    name: example smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-packages --all-extras

      - name: Run examples from a clean output directory
        run: make examples-smoke

      - name: Ensure examples do not modify tracked files
        run: git diff --exit-code

  quality:
    name: static quality checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-packages --all-extras

      - name: Check lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check types
        run: uv run mypy .

  # Branch protection requires a check named "test"; it passes only if every version passes.
  test:
    name: test
    needs: [test-matrix, examples, quality]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require tests and examples to pass
        run: |
          test "${{ needs.test-matrix.result }}" = "success"
          test "${{ needs.examples.result }}" = "success"
          test "${{ needs.quality.result }}" = "success"

  release:
    name: Release & publish
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-packages --all-extras

      - name: Check tag matches both distribution versions
        run: |
          uv run python - <<'PY'
          import os
          import sys
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          versions = {
              "utility-viz": tomllib.load(open("pyproject.toml", "rb"))["project"],
              "econ-viz": tomllib.load(open("packages/econ-viz/pyproject.toml", "rb"))["project"],
          }
          bad = [f"{name}={p['version']}" for name, p in versions.items() if f"v{p['version']}" != tag]
          pin = f"utility-viz=={versions['utility-viz']['version']}"
          if pin not in versions["econ-viz"]["dependencies"]:
              bad.append(f"econ-viz dependency is not {pin}")
          if bad:
              sys.exit(f"tag {tag} does not match: {', '.join(bad)}")
          print(f"tag {tag} matches both distributions")
          PY

      - name: Build both distributions
        run: uv build --all-packages

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
