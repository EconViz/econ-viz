[project]
name = "econ-viz"
version = "1.6.0"
description = "A Python toolkit for producing publication-quality microeconomics diagrams."
readme = "README.md"
authors = [{ name = "Anthony Sung", email = "sungpinyue@gmail.com" }]
license = "MIT"
requires-python = ">=3.10,<4.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["numpy (>=1.24.0)", "matplotlib (>=3.6.0,<4.0.0)", "scipy (>=1.13.0,<2.0.0)", "sympy (>=1.12.0,<2.0.0)"]

[project.optional-dependencies]
animation   = ["Pillow (>=9.0.0)"]
interactive = ["ipywidgets (>=8.0.0)", "IPython (>=8.0.0)"]
all         = ["Pillow (>=9.0.0)", "ipywidgets (>=8.0.0)", "IPython (>=8.0.0)"]

[project.scripts]
econ-viz = "econ_viz.cli:main"

[project.urls]
Homepage = "https://econ-viz.org"
Documentation = "https://econ-viz.org"
Repository = "https://github.com/EconViz/econ-viz"
"Bug Tracker" = "https://github.com/EconViz/econ-viz/issues"
Changelog = "https://github.com/EconViz/econ-viz/blob/main/CHANGELOG.md"


[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "econ_viz"
module-root = ""

[dependency-groups]
dev = [
    "pytest (>=8.0.0,<9.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
changelog_file = "CHANGELOG.md"
commit_message = "chore(release): {version} [skip ci]"
upload_to_pypi = false
upload_to_release = false
build_command = ""

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "style", "test", "chore", "build", "ci"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=econ_viz --cov-report=term-missing --cov-report=html:htmlcov"

[tool.coverage.run]
source = ["econ_viz"]
omit = ["econ_viz/logging.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
