[project]
name = "econ-viz"
version = "1.10.1"
description = "A Python toolkit for producing publication-quality microeconomics diagrams."
readme = "README.md"
authors = [{ name = "Anthony Sung", email = "sungpinyue@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = ["numpy (>=1.24.0)", "matplotlib (>=3.6.0,<4.0.0)", "scipy (>=1.13.0,<2.0.0)", "sympy (>=1.12.0,<2.0.0)", "tomli (>=2.0.0) ; python_version < '3.11'"]

[project.optional-dependencies]
animation   = ["Pillow (>=9.0.0)"]
interactive = ["ipywidgets (>=8.0.0)", "IPython (>=8.0.0)"]
all         = ["Pillow (>=9.0.0)", "ipywidgets (>=8.0.0)", "IPython (>=8.0.0)"]

[project.scripts]
econ-viz = "econ_viz.cli:main"

[project.urls]
Homepage = "https://econ-viz.org"
Documentation = "https://econ-viz.org"
Repository = "https://github.com/EconViz/econ-viz"
"Bug Tracker" = "https://github.com/EconViz/econ-viz/issues"
Changelog = "https://github.com/EconViz/econ-viz/blob/main/CHANGELOG.md"


[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "econ_viz"
module-root = ""

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest (>=8.0.0,<9.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=econ_viz --cov-report=term-missing --cov-report=html:htmlcov"

[tool.coverage.run]
source = ["econ_viz"]
branch = true
omit = ["econ_viz/logging.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 92

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["notebook"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # long lines are common in this codebase (dense math expressions)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
packages = ["econ_viz"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disable_error_code = ["annotation-unchecked"]
